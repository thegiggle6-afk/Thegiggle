<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TheGiggle AI | Aurevix Company</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --surface: #fdfdfd;
            --on-surface: #1a1c1e;
            --primary: #0056D2;
            --secondary-container: #e1e2ec;
            --sidebar: #f3f4f9;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--surface);
            color: var(--on-surface);
            height: 100dvh;
            display: flex;
            overflow: hidden;
        }

        /* PREMIUM GLASS MORPHISM */
        .glass-sidebar {
            background-color: var(--sidebar);
            width: 300px;
            display: flex;
            flex-direction: column;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border-right: 1px solid #e0e0e0;
        }

        /* CENTERED PROMPT BAR (GEMINI STYLE) */
        .input-floating-bar {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 850px;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 4px 30px rgba(0,0,0,0.08);
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid #eee;
        }

        .chat-bubble-user {
            background-color: var(--secondary-container);
            padding: 16px 24px;
            border-radius: 24px 24px 4px 24px;
            align-self: flex-end;
            max-width: 80%;
            font-weight: 500;
        }

        .chat-bubble-ai {
            padding: 16px 0;
            width: 100%;
            display: flex;
            gap: 20px;
        }

        /* THEME TOGGLE ANIMATION */
        .premium-profile-circle {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, #0056D2, #00C6FF);
            border-radius: 50%;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: bold;
        }

        /* SUBSCRIPTION PANEL */
        #sub-modal {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            z-index: 2000;
            place-items: center;
        }
    </style>
</head>
<body>

    <div id="auth-layer" class="fixed inset-0 z-[3000] bg-white flex flex-col items-center justify-center p-6 text-center">
        <div class="mb-10">
            <h1 class="text-4xl font-extrabold tracking-tighter mb-2">TheGiggle <span class="text-blue-600">AI</span></h1>
            <p class="text-gray-500">Intelligent Workflows by Aurevix</p>
        </div>
        <button onclick="loginWithGoogle()" class="flex items-center gap-4 border-2 border-gray-100 px-10 py-4 rounded-2xl hover:bg-gray-50 transition-all font-bold">
            <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" width="24">
            Sign in with Google
        </button>
    </div>

    <aside id="sidebar" class="glass-sidebar">
        <div class="p-6">
            <button class="w-full py-4 px-6 bg-blue-100 text-blue-700 rounded-2xl font-bold flex items-center justify-center gap-3">
                <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                New Chat
            </button>
        </div>
        <div class="flex-1 overflow-y-auto px-4" id="history-list">
            </div>
        <div class="p-6 bg-white border-t">
            <div onclick="showSubscription()" class="p-4 bg-gradient-to-r from-blue-600 to-blue-400 rounded-2xl text-white cursor-pointer hover:shadow-lg transition">
                <p class="text-[10px] font-bold uppercase">Membership</p>
                <p class="font-bold">Upgrade to Pro</p>
                <p class="text-xs opacity-80">₹299/Yearly</p>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col relative bg-white">
        <header class="p-6 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <button class="md:hidden">☰</button>
                <span class="font-bold text-xl tracking-tight">TheGiggle <span class="text-blue-600">AI</span></span>
            </div>
            <div class="flex items-center gap-4">
                <div class="premium-profile-circle" id="profile-btn" onclick="toggleProfile()">AS</div>
            </div>
        </header>

        <div id="chat-stream" class="flex-1 overflow-y-auto px-[10%] pt-10 pb-40 space-y-8 flex flex-col">
            <div class="chat-bubble-ai">
                <div class="w-10 h-10 bg-blue-600 rounded-full flex-shrink-0 flex items-center justify-center text-white font-bold">G</div>
                <div class="space-y-4">
                    <h2 class="text-3xl font-bold">Hello, Ajay Sikarwar</h2>
                    <p class="text-gray-500 text-lg leading-relaxed">How can I help you scale **TheGiggle Growth Lab** today?</p>
                </div>
            </div>
        </div>

        <div class="input-floating-bar group focus-within:ring-2 ring-blue-400">
            <label class="p-3 text-gray-500 hover:bg-gray-100 rounded-full cursor-pointer">
                <input type="file" class="hidden">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            </label>
            <input type="text" id="prompt-input" placeholder="Enter a prompt here..." class="flex-1 py-3 outline-none bg-transparent text-lg">
            <button onclick="processAIQuery()" class="p-3 text-blue-600 hover:bg-blue-50 rounded-full">
                <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
    </main>

    <div id="sub-modal" class="grid">
        <div class="bg-white p-10 rounded-[32px] max-w-sm text-center shadow-2xl">
            <div class="text-5xl mb-6">🚀</div>
            <h3 class="text-2xl font-bold mb-2">Upgrade to Pro</h3>
            <p class="text-gray-500 mb-8">Access Unlimited 3D Website Building, Code Writing, and App Generation.</p>
            <div class="bg-blue-50 p-6 rounded-2xl mb-8">
                <span class="text-3xl font-black">₹299</span> <span class="text-gray-500 text-sm">/ Year</span>
            </div>
            <button onclick="alert('Payment Gateway Integration Required')" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg">Buy Now</button>
            <button onclick="closeSub()" class="mt-4 text-gray-400 text-sm">Maybe Later</button>
        </div>
    </div>

    <script>
        // 1. FIREBASE CONFIGURATION (Enter your Real Credentials here)
        const firebaseConfig = {
            apiKey: "AIzaSyBSEGs12FJN2AVx8bHf-rDeQwOCRZJRo3k", // Key use karein
            authDomain: "thegiggle-ai.firebaseapp.com",
            projectId: "thegiggle-ai",
            storageBucket: "thegiggle-ai.appspot.com",
            messagingSenderId: "12345678",
            appId: "1:12345:web:abcdef"
        };
        firebase.initializeApp(firebaseConfig);

        const auth = firebase.auth();
        const db = firebase.firestore();

        // 2. REAL LOGIN LOGIC
        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).then((res) => {
                document.getElementById('auth-layer').style.display = 'none';
                updateProfile(res.user);
            });
        }

        function updateProfile(user) {
            document.getElementById('profile-btn').innerText = user.displayName[0];
        }

        // 3. AI LOGIC (GEMINI API)
        async function processAIQuery() {
            const input = document.getElementById('prompt-input');
            const stream = document.getElementById('chat-stream');
            const text = input.value.trim();
            if(!text) return;

            // User UI
            stream.innerHTML += `<div class="chat-bubble-user">${text}</div>`;
            input.value = '';
            stream.scrollTop = stream.scrollHeight;

            // Call Gemini API
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${firebaseConfig.apiKey}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{ parts: [{ text: `Founder: Ajay Sikarwar. You are TheGiggle AI. User says: ${text}` }] }] })
                });
                const data = await response.json();
                const reply = data.candidates[0].content.parts[0].text;

                stream.innerHTML += `
                    <div class="chat-bubble-ai">
                        <div class="w-10 h-10 bg-blue-600 rounded-full flex-shrink-0 flex items-center justify-center text-white font-bold">G</div>
                        <div class="msg-text">${reply.replace(/\n/g, '<br>')}</div>
                    </div>
                `;
            } catch(e) {
                console.error(e);
            }
            stream.scrollTop = stream.scrollHeight;
        }

        function showSubscription() { document.getElementById('sub-modal').style.display = 'grid'; }
        function closeSub() { document.getElementById('sub-modal').style.display = 'none'; }
    </script>
</body>
</html>
