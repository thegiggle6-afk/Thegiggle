<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Giggle AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <style>
        :root {
            --bg-main: #131314;
            --bg-sidebar: #1e1f20;
            --text-gray: #c4c7c5;
            --google-blue: #4285f4;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Google Sans', sans-serif; }
        
        body { background-color: var(--bg-main); color: #e3e3e3; height: 100dvh; overflow: hidden; display: flex; }

        /* --- AUTH SCREEN (DITTO CLONE) --- */
        #auth-screen {
            position: fixed; inset: 0; z-index: 9999; background: #fff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .login-box {
            width: 100%; max-width: 400px; padding: 40px; border: 1px solid #dadce0; border-radius: 8px; text-align: center;
        }

        .google-btn {
            width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
            padding: 12px; border: 1px solid #dadce0; border-radius: 4px; font-weight: 500;
            color: #3c4043; cursor: pointer; transition: 0.2s; margin-top: 24px;
        }
        .google-btn:hover { background: #f8f9fa; }

        /* --- MAIN APP UI --- */
        .app-container { display: none; width: 100%; height: 100%; }

        .sidebar {
            width: 280px; background-color: var(--bg-sidebar); display: flex; flex-direction: column;
            padding: 16px; transition: 0.3s;
        }

        @media (max-width: 768px) {
            .sidebar { position: fixed; left: -280px; height: 100%; z-index: 100; }
            .sidebar.active { left: 0; }
        }

        .new-chat {
            background: #333537; padding: 12px 16px; border-radius: 50px;
            display: flex; align-items: center; gap: 12px; font-size: 14px; cursor: pointer; width: fit-content;
        }

        .main-chat { flex: 1; display: flex; flex-direction: column; position: relative; }

        .chat-header { height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }

        .chat-body {
            flex: 1; overflow-y: auto; padding: 20px 15% 150px 15%;
            display: flex; flex-direction: column; gap: 32px;
        }

        @media (max-width: 768px) { .chat-body { padding: 20px 5% 150px 5%; } }

        .message { display: flex; gap: 20px; font-size: 16px; line-height: 1.6; }
        .avatar { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; }
        .g-avatar { background: linear-gradient(135deg, #1a73e8, #4285f4); color: white; }
        .u-avatar { background: #555; color: white; }

        /* --- FLOATING INPUT BAR --- */
        .input-wrapper {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 800px; background: #1e1f20; border-radius: 32px;
            padding: 8px 16px; display: flex; align-items: center; gap: 12px;
        }

        .input-wrapper input {
            flex: 1; background: transparent; border: none; outline: none; color: white; font-size: 16px; padding: 10px 0;
        }

        .icon-btn { color: var(--text-gray); cursor: pointer; padding: 8px; border-radius: 50%; }
        .icon-btn:hover { background: #333; }

        /* --- TYPING LOADER --- */
        .loader { display: flex; gap: 4px; padding: 10px 0; }
        .dot { width: 4px; height: 4px; background: #4285f4; border-radius: 50%; animation: bounce 1.4s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="login-box">
            <h1 class="text-2xl font-normal mb-2 text-gray-800">Sign in</h1>
            <p class="text-gray-600 text-sm">to continue to Giggle AI</p>
            <div class="google-btn" id="login-trigger">
                <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" width="20">
                Sign in with Google
            </div>
            <p class="text-xs text-gray-400 mt-10">Founder: Ajay Sikarwar | Aurevix</p>
        </div>
    </div>

    <div class="app-container" id="app">
        <aside class="sidebar" id="sidebar">
            <div class="new-chat" onclick="location.reload()">
                <span>+</span> New Chat
            </div>
            <div class="mt-10 flex-1 overflow-y-auto px-2" id="history">
                <p class="text-[11px] font-bold text-gray-500 uppercase px-4 mb-4">Recent</p>
            </div>
            <div class="text-[10px] text-gray-500 p-4 border-t border-gray-800">
                Giggle AI v2.0 Premium
            </div>
        </aside>

        <main class="main-chat">
            <header class="chat-header">
                <button class="md:hidden" onclick="document.getElementById('sidebar').classList.toggle('active')">☰</button>
                <div class="text-xl font-medium tracking-tight">Giggle <span class="text-blue-500">AI</span></div>
                <div class="avatar u-avatar" id="header-avatar">AS</div>
            </header>

            <div class="chat-body" id="chat-stream">
                <div class="message">
                    <div class="avatar g-avatar">G</div>
                    <div>
                        <h2 class="text-3xl font-medium mb-4" id="greeting">Hello, Ajay</h2>
                        <p class="text-gray-400">Main Giggle AI hoon. Main aapke liye code, images aur digital assets create kar sakta hoon. Aaj hum kya banayenge?</p>
                    </div>
                </div>
            </div>

            <div class="input-wrapper">
                <label class="icon-btn">
                    <input type="file" class="hidden">
                    <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M19 5v14H5V5h14m0-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-4.86 8.86l-3 3.87L9 13.14 6 17h12l-3.86-5.14z"/></svg>
                </label>
                <input type="text" id="user-input" placeholder="Enter a prompt here..." autocomplete="off">
                <button class="icon-btn" onclick="askAI()">
                    <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </div>
        </main>
    </div>

    <script>
        // FIREBASE SETUP
        const fbConfig = {
            apiKey: "AIzaSyBSEGs12FJN2AVx8bHf-rDeQwOCRZJRo3k",
            authDomain: "thegiggle-ai.firebaseapp.com",
            projectId: "thegiggle-ai"
        };
        firebase.initializeApp(fbConfig);

        const auth = firebase.auth();

        // 1. LOGIN HANDLER
        document.getElementById('login-trigger').addEventListener('click', () => {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).then(res => {
                renderApp(res.user);
            }).catch(e => alert("Error: " + e.message));
        });

        // 2. AUTH STATE LISTENER
        auth.onAuthStateChanged(user => {
            if (user) renderApp(user);
        });

        function renderApp(user) {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('app').style.display = 'flex';
            document.getElementById('greeting').innerText = `Hello, ${user.displayName.split(' ')[0]}`;
            document.getElementById('header-avatar').innerText = user.displayName[0];
        }

        // 3. AI CHAT ENGINE
        const input = document.getElementById('user-input');
        input.addEventListener('keypress', e => { if(e.key==='Enter') askAI(); });

        async function askAI() {
            const stream = document.getElementById('chat-stream');
            const prompt = input.value.trim();
            if(!prompt) return;

            // Update UI User
            stream.innerHTML += `<div class="message justify-end"><div class="bg-[#333537] p-4 rounded-2xl max-w-[80%]">${prompt}</div></div>`;
            input.value = '';
            stream.scrollTop = stream.scrollHeight;

            // Loading Dot
            const lid = 'l-' + Date.now();
            stream.innerHTML += `<div class="message" id="${lid}"><div class="avatar g-avatar">G</div><div class="loader"><div class="dot"></div><div class="dot" style="animation-delay:0.2s"></div><div class="dot" style="animation-delay:0.4s"></div></div></div>`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${fbConfig.apiKey}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{ parts: [{ text: `You are Giggle AI, created by Ajay Sikarwar. You are a senior developer and business advisor. Reply to: ${prompt}` }] }] })
                });

                const data = await response.json();
                const aiText = data.candidates[0].content.parts[0].text;
                document.getElementById(lid).remove();

                stream.innerHTML += `<div class="message"><div class="avatar g-avatar">G</div><div class="flex-1">${aiText.replace(/\n/g, '<br>')}</div></div>`;
            } catch (e) {
                document.getElementById(lid).innerHTML = "API Error. Please check Console.";
            }
            stream.scrollTop = stream.scrollHeight;
        }
    </script>
</body>
</html>
